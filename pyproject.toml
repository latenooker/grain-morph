[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grain-morph"
version = "0.1.0"
description = "Classical-CV morphometry + QC pipeline for backlit silhouette grain images (CAMSIZER X2)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nate Looker" }]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "scikit-image>=0.22",
  "shapely>=2.0",
  "pyefd>=1.6",
  "wadell_rs @ git+https://github.com/PaPieta/wadell_rs.git",
  "pandas>=2.0",
  "pyarrow>=14",
  "imageio>=2.31",
  "typer>=0.12",
  "pydantic>=2.5",
  "PyYAML>=6.0",
  "joblib>=1.3",
  "tqdm>=4.66",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov", "ruff>=0.5", "mypy>=1.8", "psutil>=5.9"]

[project.scripts]
grain-morph = "grain_morph.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "realdata: opt-in tests against full-res frames on /Volumes/LEXAR (skipped if absent)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
