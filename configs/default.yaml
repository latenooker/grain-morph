# grain-morph default configuration.
#
# Every threshold/kernel/parameter the pipeline uses lives here — no magic
# numbers in source. Copy this file, override only the keys you need, and
# pass the override to `load_config(path)`; it is deep-merged on top of this
# packaged default.

calibration:
  # REQUIRED at run time: microns per pixel, per camera. null -> fail loudly
  # (Config.um_per_px raises KeyError) until the operator sets a real value.
  um_per_px: { basic: null, zoom: null }

filename:
  # Captures sample_id, camera code, and either a frame index or the literal
  # back-flat token from a frame's filename stem.
  sample_regex: '(?P<sample>.+?)_(?P<cam>[bz])_(?:(?P<frame>\d+)|back)$'
  camera_map: { b: basic, z: zoom }
  # Blank/background marker used ONLY when `detect --sample-id/--camera`
  # overrides identity for stems that don't match `sample_regex` (e.g. all
  # frames in one directory named only by index). Matches `back`, `x_back`,
  # `x-back` case-insensitively. Ignored when `sample_regex` matches.
  blank_regex: '(?i)(?:^|[_-])back$'

flatfield:
  method: auto # auto | blank | morphological
  morph_kernel_px: 201

threshold:
  method: half_max # half_max | otsu
  half_max_fraction: 0.5
  core_percentile: 5 # dark-pixel percentile used to estimate opaque core
  min_object_depth: 0.40 # a pixel counts as opaque object-core if >=40% below background (1.0); a frame with fewer than detect.min_area_px such pixels is treated as object-free (guards against tracing amplified sensor noise on empty frames)

detect:
  min_area_px: 25
  fill_holes: true

measure:
  efd_order: 15
  efd_resample_n: 256
  wadell_smoothing: 1.0
  curvature_resample_n: 256
  curvature_smoothing: 2.0
  curvature_bins: 32

qc:
  min_ecd_px: 10
  defocus_edge_width_px: 5.25 # edge_width above this -> defocus (tuned on labeled OK_sand/P_01/P_17 grains; see docs/followups.md)
  defocus_contrast_min: 0.70 # contrast below this -> defocus (demoted to an extreme-debris catch; edge_width is the primary focus signal)
  sliver_aspect_ratio: 3.0
  sliver_max_ecd_px: 40
  agglomerate_solidity_max: 0.90
  disqualifying_flags: [flag_defocus, flag_border, flag_too_small, flag_sliver, flag_no_polygon]

output:
  # csv by default: text, human-inspectable, opens anywhere. For lossless dtype
  # round-trips (and hive partitioning, below) switch to parquet or feather.
  format: csv # csv | parquet | feather
  save_contours: true
  partition: true # parquet-only; ignored for csv/feather (one file per frame)

runtime:
  n_jobs: -1 # -1 = all cores; run_detect(n_jobs=...) / CLI --jobs override this

groundtruth:
  # Keystroke-assignable classes for the `groundtruth` labeling GUI.
  classes:
    - { key: '0', value: 0, name: exclude }
    - { key: '1', value: 1, name: include }
    - { key: '2', value: 2, name: special }
  # Continuous grain-table metrics the Latin-hypercube sample spans -- exactly
  # the values the QC gate thresholds on, so labels inform each cut.
  lhs_axes: [ecd_px, edge_width_px, contrast, qc_aspect_ratio, qc_solidity]
  # Minimum grains reserved for the boolean QC flags with no continuous axis
  # (filled when present in the pool, before the hypercube draws the rest).
  reserved: { border: 2, no_polygon: 1 }
  crop_pad_px: 24 # padding around a grain's polygon bbox in its zoomed view
  mask_alpha: 0.35 # opacity of the translucent polygon-mask fill
  show_predicted_status: false # keep labels unbiased; toggle live with `i`
