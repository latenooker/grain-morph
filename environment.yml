# Conda / miniconda environment for grain-morph.
#
#   conda env create -f environment.yml
#   conda activate grain-morph
#
# Binary-heavy dependencies are pulled as conda-forge builds so nothing has to
# compile locally; the pip section then installs grain-morph itself in editable
# mode (`-e .`), which also fetches the two dependencies not on conda-forge:
# pyefd (PyPI) and wadell_rs (git). `pyproject.toml` remains the single source
# of dependency truth -- this file only supplies pre-built binaries first.
#
# This is the *convenient* path. For a fully pinned, reproducible install use
# the committed uv.lock via `uv sync` instead.
#
# Runtime only. For the dev tools (pytest, ruff, mypy, psutil) run, after
# activating: pip install -e ".[dev]"
name: grain-morph
channels:
  - conda-forge
  - nodefaults          # don't mix the anaconda `defaults` channel
dependencies:
  - python=3.11
  - numpy>=1.24
  - scipy>=1.11
  - scikit-image>=0.22
  - shapely>=2.0        # brings GEOS
  - pandas>=2.2
  - pyarrow>=14
  - imageio>=2.31
  - matplotlib>=3.8
  - joblib>=1.3
  - tqdm>=4.66
  - pyyaml>=6.0
  - typer>=0.12
  - pydantic>=2.5
  - pip
  - pip:
      - -e .            # grain-morph + pyefd + wadell_rs (git); reuses the
                        # conda binaries above, so only these get built/fetched
